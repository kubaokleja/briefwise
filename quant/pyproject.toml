[project]
name = "briefwise-quant"
version = "0.1.0"
description = "Briefwise quant batch: market data refresh, volatility/VaR forecasts (talks to Java only through the database)."
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefwise_quant"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
