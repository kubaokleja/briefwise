# Replay provider + seeded snapshot: runs without any API key.
spring:
  ai:
    model:
      chat: anthropic         # only so ChatClient exists: replay + on-miss fail never reaches it (ADR 0015)
    anthropic:
      api-key: replay-only-no-key
      base-url: http://127.0.0.1:9   # discard port: even a bug cannot reach the real API or spend money

briefwise:
  market:
    price-snapshot:
      import-on-startup: true
  llm:
    provider: replay
    replay:
      on-miss: fail
