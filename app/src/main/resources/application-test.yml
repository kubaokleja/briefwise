# Tests: Testcontainers provide the database, WireMock provides HTTP APIs, LLM calls are replayed (never live).
springdoc:
  api-docs:
    enabled: true             # OpenApiSpecIT compares the spec with docs/openapi.json

briefwise:
  llm:
    provider: replay
    replay:
      on-miss: fail
  aiops:
    pricing:
      test-model: { input: 1.00, output: 2.00 }   # round numbers: 1M input tokens = 1 USD
    daily-budget-usd:
      it-feature: 0.01
  news:
    finnhub:                  # base-url points at WireMock (set by AbstractIntegrationTest)
      api-key: test-key
      retry-delay: 10ms
    outbox:
      relay-enabled: false    # tests call NewsFacade.publishPending() themselves
    kafka:
      retry-backoff: 10ms
