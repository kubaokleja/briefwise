# Shared defaults. Profile files (application-{local,cloud,job,demo,test}.yml) override per environment.
# `local` is the default profile when none is active (Docker Compose stack).
spring:
  application:
    name: briefwise
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/briefwise}
    username: ${DB_USER:briefwise}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:briefwise}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway is the only schema source; never "update"
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI spec at /v3/api-docs, enabled only in `local` and `test` (ADR 0007). Sorted and pretty-printed so the
# committed docs/openapi.json diffs cleanly.
springdoc:
  api-docs:
    enabled: false
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# See DESIGN 13.2. Model names live here only, never in code.
briefwise:
  execution:
    mode: on-demand          # on-demand | scheduled
  jobs:
    news-ingest:
      enabled: true
      cron: "0 */15 7-22 * * MON-FRI"
    news-classify:
      enabled: true
    risk-alerts:
      enabled: true
    brief:
      enabled: false         # expensive model; on demand by default
  llm:
    replay:
      on-miss: fail          # fail (CI, demo) | fallback (local)
  aiops:
    # USD per 1M tokens, Anthropic first-party rates (checked 2026-10-21; re-check before relying on them).
    # Haiku 5.5 rates apply to prompts up to 100K tokens. Every model the app calls needs an entry (ADR 0008).
    pricing:
      claude-haiku-5-5: { input: 0.10, output: 0.50 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00 }
    # USD per feature per UTC day (ADR 0008). A feature without an entry cannot call an LLM.
    daily-budget-usd:
      news-classification: 0.10
  cors:
    allowed-origins:
      - http://localhost:5173
