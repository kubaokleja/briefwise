# Shared defaults. Profile files (application-{local,cloud,job,demo,test}.yml) override per environment.
# `local` is the default profile when none is active (Docker Compose stack).
spring:
  application:
    name: briefwise
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/briefwise}
    username: ${DB_USER:briefwise}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:briefwise}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway is the only schema source; never "update"
  flyway:
    enabled: true
  kafka:                       # news.raw via the transactional outbox (ADR 0011); String keys and JSON-text values
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                # the relay marks a row published only after every in-sync replica has it
      properties:              # fail fast when the broker is gone; all below briefwise.news.kafka.send-timeout
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest   # a new consumer group starts at the oldest message, not the newest
  ai:                          # Spring AI 2.0. Model names live here only, never in code (ADR 0012)
    model:
      chat: none               # anthropic | ollama | none: exactly one chat model per profile
      embedding: none          # embeddings come with M2
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: 20s             # per HTTP attempt (R1, ADR 0012)
      max-retries: 1           # SDK transport retries after the first attempt
      chat:
        model: claude-haiku-5-5
        max-tokens: 1024       # default; the classifier also sets it per call
        cache-options:
          strategy: SYSTEM_ONLY  # cache the system prompt + few-shot prefix (L5); default TTL 5 minutes
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.1:8b     # dev only, never for evals; pull: docker compose exec ollama ollama pull llama3.1:8b
        temperature: 0.0

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI spec at /v3/api-docs, enabled only in `local` and `test` (ADR 0007). Sorted and pretty-printed so the
# committed docs/openapi.json diffs cleanly.
springdoc:
  api-docs:
    enabled: false
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# See DESIGN 13.2. Model names live here only, never in code.
briefwise:
  execution:
    mode: on-demand          # on-demand | scheduled
  job-runner:                # --briefwise.job=<id> runs one job and exits (ADR 0016)
    max-duration: 15m        # then exit 1; leftovers stay RECEIVED / pending for the next run
    lag-poll-interval: 2s
  jobs:                      # enabled: scheduler and job runner only; "run now" always works
    news-ingest:
      enabled: true
      cron: "0 */15 7-22 * * MON-FRI"
    news-classify:
      enabled: true
    news-classification-eval:  # never scheduled: evals.yml (job runner) or "run now"; disabled would exit 0 = green
      enabled: true
    risk-alerts:
      enabled: true
    brief:
      enabled: false         # expensive model; on demand by default
  llm:                       # ADR 0015. provider=replay answers from recordings; others pass to spring.ai.model.chat
    replay:
      on-miss: fail          # fail (CI, demo): never call the model | fallback: call it and record the answer
      fixtures-dir: ../evals/replay   # committed *.jsonl fixtures, relative to app/; asked before ai_generation_log
  news:
    ingest:
      lookback-days: 2       # today + 2 UTC days back; overlap with the last run is dropped by URL hash
    dedup:                   # near-duplicate headline (D1, ADR 0009): same ticker, within window, similarity >=
      headline-similarity: 0.6
      window: 48h
    outbox:                  # polling relay to news.raw (K1, ADR 0011)
      relay-enabled: true
      poll-interval: 5s
      batch-size: 100
    kafka:                   # news.raw consumer: max-attempts deliveries retry-backoff apart, then news.raw.DLT
      partitions: 3
      max-attempts: 3
      retry-backoff: 1s
      send-timeout: 15s      # relay wait for one broker ack
      consumer-enabled: true
    sweep:                   # classifyPending: items stuck in RECEIVED (ADR 0016)
      min-age: 10m           # never races the relay or a consumer still at work
      batch-size: 200        # oldest first; the run stops at the first deferral (budget used up)
      max-attempts: 3        # then UNCLASSIFIED (RETRIES_EXHAUSTED)
      provider-error-retry-window: 48h   # PROVIDER_ERROR items this recent are reopened and retried
    classification:          # LLM call per item (ADR 0012); model: spring.ai.<provider>.chat.model
      feature: news-classification
      max-tokens: 1024       # adaptive thinking + ~100 tokens of JSON
      effort: low            # Anthropic only; Haiku 5.5 takes no temperature
      max-attempts: 2        # first call + one re-ask after invalid output
      max-summary-chars: 2000
    selection:               # getRelevantNews and the summary input (ADR 0017)
      window: 24h            # published within; also keeps stale late-classified items out of today's summary
      max-items: 15          # most relevant first, then by portfolio weight
      min-relevance: MEDIUM
    summary:                 # daily portfolio summary, one LLM call per portfolio past the gate (ADR 0017)
      feature: news-summary
      max-tokens: 2048       # adaptive thinking + up to 5 points of JSON
      effort: low            # Anthropic only
      max-attempts: 2        # first call + one re-ask after invalid output; the compliance re-ask is separate
      max-points: 5
      max-summary-chars: 300 # per item in the prompt
    eval:                    # classification eval against the golden set (DESIGN 10, ADR 0018); paths from the repo root
      golden-path: evals/sentiment_golden.csv            # decrypted by evals/scripts/decrypt-golden.sh, git-ignored
      results-dir: evals/results/news-classification     # latest.json + latest.md written, baseline.json read
      max-drop-points: 3.0   # gate: sentiment macro F1 at most 3 pp below the baseline
      batch:                 # Message Batches API: half price, asynchronous; model/max-tokens/effort as classification
        feature: news-classification-eval
        poll-interval: 30s
        max-wait: 60m        # then the batch is cancelled and the run fails (INCOMPLETE)
        cancel-wait: 5m      # after the cancel: wait for the end, then record the requests that were billed
        request-timeout: 60s
    finnhub:                 # free tier: personal use only, about 60 calls/min, 30/s hard cap (checked 2026-10-21)
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:}
      connect-timeout: 5s
      read-timeout: 10s
      max-retries: 2         # on 429, 5xx, I/O errors (ADR 0005); delay doubles
      retry-delay: 1s
  aiops:
    # USD per 1M tokens, Anthropic first-party rates (checked 2026-10-21; re-check before relying on them).
    # Haiku 5.5 rates apply to prompts up to 100K tokens. Every model the app calls needs an entry (ADR 0008).
    # Cache prices (5-minute write, read) checked 2026-10-24; without them 1.25x / 0.1x of input apply.
    pricing:
      claude-haiku-5-5: { input: 0.10, output: 0.50, cache-write: 0.125, cache-read: 0.01 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00, cache-write: 2.50, cache-read: 0.10 }
    # USD per feature per UTC day (ADR 0008). A feature without an entry cannot call an LLM.
    daily-budget-usd:
      news-classification: 0.10
      news-summary: 0.05     # ~0.001 per call on Haiku 5.5
      news-classification-eval: 0.50   # DESIGN 13: < 0.5 USD per run; 258 items on Haiku 5.5 at batch price ~0.02
  cors:
    allowed-origins:
      - http://localhost:5173
