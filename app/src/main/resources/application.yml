# Shared defaults. Profile files (application-{local,cloud,job,demo,test}.yml) override per environment.
# `local` is the default profile when none is active (Docker Compose stack).
spring:
  application:
    name: briefwise
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/briefwise}
    username: ${DB_USER:briefwise}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:briefwise}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway is the only schema source; never "update"
  flyway:
    enabled: true
  kafka:                       # news.raw via the transactional outbox (ADR 0011); String keys and JSON-text values
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                # the relay marks a row published only after every in-sync replica has it
      properties:              # fail fast when the broker is gone; all below briefwise.news.kafka.send-timeout
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest   # a new consumer group starts at the oldest message, not the newest

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# OpenAPI spec at /v3/api-docs, enabled only in `local` and `test` (ADR 0007). Sorted and pretty-printed so the
# committed docs/openapi.json diffs cleanly.
springdoc:
  api-docs:
    enabled: false
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# See DESIGN 13.2. Model names live here only, never in code.
briefwise:
  execution:
    mode: on-demand          # on-demand | scheduled
  jobs:
    news-ingest:
      enabled: true
      cron: "0 */15 7-22 * * MON-FRI"
    news-classify:
      enabled: true
    risk-alerts:
      enabled: true
    brief:
      enabled: false         # expensive model; on demand by default
  llm:
    replay:
      on-miss: fail          # fail (CI, demo) | fallback (local)
  news:
    ingest:
      lookback-days: 2       # today + 2 UTC days back; overlap with the last run is dropped by URL hash
      on-startup: false      # stopgap trigger until the admin endpoint / job runner (M1 slice 6)
    dedup:                   # near-duplicate headline (D1, ADR 0009): same ticker, within window, similarity >=
      headline-similarity: 0.6
      window: 48h
    outbox:                  # polling relay to news.raw (K1, ADR 0011)
      relay-enabled: true
      poll-interval: 5s
      batch-size: 100
    kafka:                   # news.raw consumer: max-attempts deliveries retry-backoff apart, then news.raw.DLT
      partitions: 3
      max-attempts: 3
      retry-backoff: 1s
      send-timeout: 15s      # relay wait for one broker ack
      consumer-enabled: true
    finnhub:                 # free tier: personal use only, about 60 calls/min, 30/s hard cap (checked 2026-10-21)
      base-url: https://finnhub.io/api/v1
      api-key: ${FINNHUB_API_KEY:}
      connect-timeout: 5s
      read-timeout: 10s
      max-retries: 2         # on 429, 5xx, I/O errors (ADR 0005); delay doubles
      retry-delay: 1s
  aiops:
    # USD per 1M tokens, Anthropic first-party rates (checked 2026-10-21; re-check before relying on them).
    # Haiku 5.5 rates apply to prompts up to 100K tokens. Every model the app calls needs an entry (ADR 0008).
    pricing:
      claude-haiku-5-5: { input: 0.10, output: 0.50 }
      claude-sonnet-5-5: { input: 2.00, output: 10.00 }
    # USD per feature per UTC day (ADR 0008). A feature without an entry cannot call an LLM.
    daily-budget-usd:
      news-classification: 0.10
  cors:
    allowed-origins:
      - http://localhost:5173
