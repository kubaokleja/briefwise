# Non-web runner for GitHub Actions (`--briefwise.job=<name>`, runs and exits). Combine with `cloud`:
#   SPRING_PROFILES_ACTIVE=cloud,job
spring:
  main:
    web-application-type: none
  ai:
    model:
      chat: anthropic         # key from ANTHROPIC_API_KEY

briefwise:
  llm:
    provider: anthropic
