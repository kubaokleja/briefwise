# Neon database + Claude API. Secrets come from the environment (GitHub Secrets / .env), never from this file.
spring:
  datasource:
    url: ${NEON_JDBC_URL}
    username: ${NEON_DB_USER}
    password: ${NEON_DB_PASSWORD}
  ai:
    model:
      chat: anthropic         # key from ANTHROPIC_API_KEY

briefwise:
  llm:
    provider: anthropic
