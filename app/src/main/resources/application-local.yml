# Default for development: Docker Compose (Postgres + pgvector, Kafka, Ollama). Zero LLM cost.
server:
  address: 127.0.0.1          # not reachable from the LAN: the admin endpoint is open until M4 auth (ADR 0007)

springdoc:
  api-docs:
    enabled: true

spring:
  ai:
    model:
      chat: ollama              # zero cost; needs `ollama pull llama3.1:8b` in the compose container

briefwise:
  aiops:
    pricing:
      "[llama3.1:8b]": { input: 0, output: 0 }
  market:
    price-snapshot:
      import-on-startup: true   # data/prices/ -> daily_prices; idempotent. Directory is relative to app/
  llm:
    provider: ollama
    replay:
      on-miss: fallback
