name: Morning pipeline

# DESIGN 7.2 / 14.2, ADR 0003 and 0016: the daily pipeline against Neon, with Kafka as a service container for the
# duration of the run. Postgres is the source of truth: whatever is not finished stays there for the next run.
# The schedule only acts when the repository variable PIPELINE_ENABLED is 'true'; a manual run always works.
# Cron is UTC and may start late; never rely on minute precision.
on:
  schedule:
    - cron: '30 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

# Never two runs at once; a later run waits instead of cancelling one that is already spending tokens.
concurrency:
  group: morning-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: morning-pipeline
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The job runner stops itself after briefwise.job-runner.max-duration (15m); this is the outer guard.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app

    services:
      # Single-node KRaft broker, as in docker-compose.yml. Topics are created by the app at startup.
      kafka:
        image: apache/kafka:4.3.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: app/pom.xml

      # Tests run in CI on every push; here only the jar is needed.
      - name: Build the app
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      # Step 1 (M3): quant batch -> risk_forecasts.

      # Step 2: news ingest + classification. Exit code 0 done, 1 failed or timed out, 2 unknown job.
      - name: News ingest and classification
        env:
          SPRING_PROFILES_ACTIVE: cloud,job
          NEON_JDBC_URL: ${{ secrets.NEON_JDBC_URL }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        run: java -jar target/briefwise-app-*.jar --briefwise.job=news-ingest

      # Step 3 (M3): risk.evaluateAlerts.
