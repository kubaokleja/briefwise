name: CI

# DESIGN 14.2: every PR and every push to the default branch. No secrets are used, so fork PRs behave the same.
on:
  pull_request:
  push:
    branches: [master]

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the running build; on master every commit is built.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job `name` below is the check name to require in branch protection.
  verify:
    name: app-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Caches ~/.m2/repository, keyed on the pom files.
          cache: maven
          cache-dependency-path: app/pom.xml

      # Runs, in order: compile, unit tests (Surefire, *Test, includes ArchitectureTest),
      # integration tests (Failsafe, *IT, Testcontainers start Postgres/pgvector on the runner's Docker), verify.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/target/surefire-reports
            app/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  # Python quant batch (DESIGN 14.2). Tests are offline: yfinance is stubbed, the price snapshot is never refreshed here.
  quant-verify:
    name: quant-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: quant
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag since v8, so the full version is pinned (Dependabot bumps it).
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.1'
          enable-cache: true
          cache-dependency-glob: quant/uv.lock

      # Python 3.12 comes from quant/.python-version; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  # React UI (ADR 0007). Unit tests only; no backend is started here.
  ui-verify:
    name: ui-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # npm ci installs exactly what package-lock.json says and fails if it is out of sync with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # docs/openapi.json is kept current by OpenApiSpecIT (app-verify); the generated types must match it.
      - name: API types up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
